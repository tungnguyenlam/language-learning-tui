[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-tester"
version = "0.1.0"
description = "A headless TUI testing utility for agent-based workflows."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pexpect>=4.8.0",
    "pyte>=0.8.1"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
tui-tester = "tui_tester.cli:main"

[tool.setuptools]
packages = ["tui_tester"]

[tool.setuptools.package-dir]
tui_tester = "."
