version: 2

project_name: deutsch-tui

builds:
  - main: ./cmd/deutsch-tui
    binary: deutsch-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - format: binary
    name_template: "{{ .ProjectName }}-{{ if eq .Os \"darwin\" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: default
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: tungnguyenlam
    homepage: https://github.com/tungnguyenlam/language-learning-tui
    maintainer: tungnguyenlam
    description: A terminal-native German flashcard and quiz app.
    license: MIT
    formats:
      - deb
      - rpm

winget:
  - name: deutsch-tui
    publisher: tungnguyenlam
    title: deutsch-tui
    short_description: Terminal-native German flashcard app.
    description: A terminal-native German flashcard and quiz app with FSRS scheduling.
    tags:
      - flashcards
      - german
      - terminal
      - tui
    license: MIT
    publisher_support_url: https://github.com/tungnguyenlam/language-learning-tui/issues
    package_identifier: tungnguyenlam.deutsch-tui
    repository:
      owner: tungnguyenlam
      name: winget-pkgs
      branch: "deutsch-tui-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

brews:
  - name: deutsch-tui
    repository:
      owner: tungnguyenlam
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/tungnguyenlam/language-learning-tui
    description: A terminal-native German flashcard and quiz app.
    license: MIT

publishers:
  - name: gemfury
    ids:
      - default
    dir: "{{ dir .ArtifactPath }}"
    cmd: |
      curl -F package=@{{ .ArtifactName }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/{{ .Env.FURY_ACCOUNT }}/
